name: CI — IEC 62304 Class C Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-typecheck:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-tests:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests (IEC 62304 Clause 5.5)
        run: npx vitest run --reporter=verbose src/services/ src/utils/
        timeout-minutes: 5

  backend-tests:
    name: Backend Pytest (Class C Unit Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      JWT_SECRET_KEY: test-secret-key-minimum-32-characters-required-for-security
      ENCRYPTION_MASTER_KEY: test-encryption-key-32-chars-min
      GCS_BUCKET_NAME: test-bucket
      GOOGLE_CLOUD_PROJECT: test-project
      FIRESTORE_EMULATOR_HOST: localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Firestore Emulator
        run: |
          cd ..
          npm install -g firebase-tools
          firebase emulators:start --only firestore --project test-project &
          sleep 5
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout
      - name: Run unit tests with coverage (IEC 62304 Clause 5.5.5)
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --timeout=60
        timeout-minutes: 10
      - name: Run integration tests (IEC 62304 Clause 5.6)
        run: |
          python -m pytest tests/integration/ -v --tb=short -k "not requires_pacs and not requires_gcs" --timeout=60
        timeout-minutes: 10
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  security-audit:
    name: SOUP Vulnerability Scan (IEC 81001-5-1 Clause 5.3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Frontend SOUP audit
        run: |
          cd frontend && npm ci
          echo "=== npm audit results ==="
          npm audit --audit-level=high 2>&1 || echo "::warning::npm audit found high/critical vulnerabilities — review required per IEC 81001-5-1"
      - name: Backend SOUP audit
        run: |
          pip install pip-audit
          cd backend && pip install -r requirements.txt
          echo "=== pip-audit results ==="
          pip-audit --desc on 2>&1 || echo "::warning::pip-audit found vulnerabilities — review required per IEC 81001-5-1"

  syntax-check:
    name: Python Syntax & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all Python files parse correctly
        run: |
          find backend/app -name "*.py" -exec python -c "
          import ast, sys
          try:
              with open(sys.argv[1], 'r') as f:
                  ast.parse(f.read())
          except SyntaxError as e:
              print(f'FAIL: {sys.argv[1]}: {e}')
              sys.exit(1)
          " {} \;
          echo "All Python files syntax OK"
