name: CI — IEC 62304 Class C Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-typecheck:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-tests:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests (IEC 62304 Clause 5.5)
        run: npx vitest run --reporter=verbose src/services/ src/utils/
        timeout-minutes: 5

  backend-tests:
    name: Backend Pytest (Class C Unit Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      JWT_SECRET_KEY: test-secret-key-minimum-32-characters-required-for-security
      ENCRYPTION_MASTER_KEY: test-encryption-key-32-chars-min
      GCS_BUCKET_NAME: test-bucket
      GOOGLE_CLOUD_PROJECT: test-project
      FIRESTORE_EMULATOR_HOST: localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout
      - name: Run unit tests with coverage (IEC 62304 Clause 5.5.5)
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --timeout=60
        timeout-minutes: 10
      - name: Run integration tests (IEC 62304 Clause 5.6)
        run: |
          python -m pytest tests/integration/ -v --tb=short -k "not requires_pacs and not requires_gcs and not requires_firestore" --timeout=60
        timeout-minutes: 10
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  risk-control-verification:
    name: Risk Control Verification (ISO 14971 / CAPA-001 PA-2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      JWT_SECRET_KEY: test-secret-key-minimum-32-characters-required-for-security
      ENCRYPTION_MASTER_KEY: test-encryption-key-32-chars-min
      GCS_BUCKET_NAME: test-bucket
      GOOGLE_CLOUD_PROJECT: test-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # CAPA-001 PA-2. Root cause #4 was "a missing control produces a green
      # build". This job is the gate that makes that impossible: the manifest
      # binds every implemented risk control to a named test, and the manifest
      # test fails if that test has been deleted or emptied.
      - name: Enforce risk-control → test manifest
        run: python -m pytest tests/unit/test_risk_control_manifest.py -v --tb=short

      # Belt and braces: run the risk-control tests by name. The minimum-count
      # check lives in test_risk_control_manifest.py rather than here, because
      # counting pytest's `--collect-only -q` output in shell is fragile across
      # pytest versions (it silently reported 0 against pytest 9 while 28 tests
      # were in fact collected — a false negative in a gate is as bad as a false
      # positive).
      - name: Run risk-control tests
        run: python -m pytest tests/unit/ -k "test_rc" -v --tb=short

      # CAPA-001 §3 root cause #4: tests/security/ existed but was never executed
      # by CI. When first run (2026-07-18) it did not even import: it referenced
      # `app.core.security.auth`, a module that has never existed in this
      # repository's history. After repairing that import the suite reported
      # 63 failed / 43 errors / 9 passed — it was written against a codebase
      # shape that does not exist.
      #
      # This step is deliberately NON-BLOCKING and deliberately loud. Making it
      # blocking today would red-line every build; deleting it would destroy the
      # evidence; and silently omitting it is what produced the problem. It stays
      # visible until CAPA-003 repairs the suite, at which point continue-on-error
      # MUST be removed. Do not read a green pipeline as "security tests pass".
      - name: Run security test suite (CAPA-003 — known broken, non-blocking)
        continue-on-error: true
        run: |
          echo "::warning::tests/security/ is known broken — see CAPA-003. This step does not gate the build."
          python -m pytest tests/security/ -v --tb=short -k "not requires_gcs and not requires_firestore"

  security-audit:
    name: SOUP Vulnerability Scan (IEC 81001-5-1 Clause 5.3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Frontend SOUP audit
        run: |
          cd frontend && npm ci
          echo "=== npm audit results ==="
          npm audit --audit-level=high 2>&1 || echo "::warning::npm audit found high/critical vulnerabilities — review required per IEC 81001-5-1"
      - name: Backend SOUP audit
        run: |
          pip install pip-audit
          cd backend && pip install -r requirements.txt
          echo "=== pip-audit results ==="
          pip-audit --desc on 2>&1 || echo "::warning::pip-audit found vulnerabilities — review required per IEC 81001-5-1"

  syntax-check:
    name: Python Syntax & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # CAPA-001 PA-2: the previous implementation used `find -exec python -c ...`,
      # which does NOT propagate the exit code of the executed command. A file
      # with a syntax error printed FAIL and the job stayed green — the same
      # "absence goes unnoticed" failure mode that opened CAPA-001, inside the
      # verification pipeline itself. Verified: `find . -exec python -c
      # "sys.exit(1)" \;` returns 0.
      - name: Check all Python files parse correctly
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          failures = []
          for path in pathlib.Path("backend/app").rglob("*.py"):
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as exc:
                  failures.append(f"{path}: {exc}")

          for failure in failures:
              print(f"::error::SyntaxError {failure}")

          if failures:
              sys.exit(f"{len(failures)} file(s) failed to parse")
          print("All Python files syntax OK")
          PY
