<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLAMeS ensemble check</title>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Drives the BUILT flamesInBrowser.worker exactly as useBrowserFlames does, with the three folds, and reports back to ensemble_check.py.
const params = new URLSearchParams(location.search);
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = (m) => { document.getElementById('out').textContent += '\n' + m; return post('/log', String(m)); };
const runsOf = (voxels) => {
  const runs = [];
  for (const v of voxels) {
    const last = runs[runs.length - 1];
    if (last && v === last[0] + last[1]) last[1] += 1;
    else runs.push([v, 1]);
  }
  return runs;
};

await log(`isolated=${self.crossOriginIsolated} threads=${navigator.hardwareConcurrency} ua=${navigator.userAgent}`);
const models = await (await fetch('/models.json')).json();
const flair = await (await fetch('/flair.nii.gz')).arrayBuffer();
const worker = new Worker(params.get('worker'), { type: 'module' });
const t0 = performance.now();
let lastStage = '';
worker.onerror = (e) => post('/result', JSON.stringify({ error: { type: 'onerror', message: e.message } }));
worker.onmessage = async (event) => {
  const m = event.data;
  if (m.type === 'progress') {
    const key = m.stage + ':' + Math.floor(m.fraction * 4);
    if (key !== lastStage) { lastStage = key; await log(`${((performance.now() - t0) / 1000).toFixed(1)}s ${m.stage} ${(m.fraction * 100).toFixed(0)}% ${m.message}`); }
  } else if (m.type === 'log') {
    await log('worker: ' + m.message);
  } else if (m.type === 'result') {
    await post('/mask', m.maskApp);
    await post('/candidates', JSON.stringify((m.candidates ?? []).map((c) => ({ score: c.score, runs: runsOf(c.voxels) }))));
    const { componentVolumesMl, ...summary } = m.summary;
    await post('/result', JSON.stringify({ dims: m.dims, spacing: m.spacing, summary, provenance: m.provenance,
      wallSeconds: (performance.now() - t0) / 1000, isolated: self.crossOriginIsolated, hardwareConcurrency: navigator.hardwareConcurrency }));
    await log('DONE');
  } else if (m.type === 'error') {
    await post('/result', JSON.stringify({ error: m, wallSeconds: (performance.now() - t0) / 1000 }));
    await log('ERROR ' + m.message);
  }
};
worker.postMessage({ type: 'segment', jobId: 'check', nifti: flair, model: models[0], preferWebGPU: false, mirror: false,
  seriesDescription: null, clinicianConfirmedFlair: true, strippedByApp: true }, [flair]);
</script>
</body>
</html>
