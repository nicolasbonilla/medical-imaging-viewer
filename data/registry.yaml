# CALM-MS dataset registry — VETTED catalogue. Each entry was assessed against a
# scientific-quality rubric (provenance, annotation/consensus type, geometry,
# site diversity, license, completeness, contamination, CALM-MS fitness) by a
# per-dataset deep read of the primary data paper (2026-08-17). Fields below carry
# the VERIFIED findings, not marketing numbers.
#
# verdict:        include | conditional | exclude
# consensus_type: multi_rater_staple | multi_rater_discussion | hierarchical_review
#                 (single-rater + senior correction) | single | none
# usable_labeled: expert-mask cases actually obtainable (test GT is often hidden)
# geometry:       3D_iso | 2D_thick | mixed
# space:          MNI_1mm | native

datasets:

  isbi2015:
    title: "ISBI-2015 Longitudinal MS Lesion Challenge"
    source: "https://smart-stats-tools.org/lesion-challenge-2015"
    license: "open (challenge terms)"
    verdict: have
    patients: 19
    usable_labeled: 19
    consensus_type: multi_rater_discussion   # 2 raters
    sequences: [T1, T2, PD, FLAIR]
    geometry: 3D_iso
    space: MNI_1mm
    cohort: cohorts/isbi19-lstai
    base_model_overlap: {flames: true}       # CONFIRMED: FLAMeS ref 12 (Carass 2017) = ISBI-2015 -> IN-SAMPLE
    appears_in: [shifts_ms]                   # ISBI = Shifts training split
    caveats: "CONTAMINATED for a FLAMeS base: ISBI-2015 is FLAMeS training data (paper ref 12) AND a Shifts-MS component. FORBIDDEN as a FLAMeS conformal null / held-out test. Single(-ish)-rater. Usable only with a base model provably not trained on it."

  open_ms_data:
    title: "Ljubljana 3D-MS-DB (Lesjak et al., Neuroinformatics 2018)"
    source: "https://github.com/muschellij2/open_ms_data"
    license: "CC-BY"
    verdict: include                         # TIER 1 — best quality/effort
    patients: 30                             # + 20 longitudinal (lesion-change masks)
    usable_labeled: 30
    longitudinal: 20
    consensus_type: multi_rater_discussion   # 3 raters, joint-session consensus, dual-pass 6-mo QA
    sequences: [T1, T1-Gd, T2, FLAIR]
    geometry: 3D_iso
    space: MNI_1mm                           # ships raw + coreg + 1mm + MNI
    subset_gb: 0.57
    status: have
    fetch: manifests/fetch_open_ms_data.sh
    base_model_overlap: {flames: true}       # CONFIRMED: FLAMeS ref 13 (Lesjak 2018) = this dataset -> IN-SAMPLE
    appears_in: [shifts_ms]                   # = Shifts PubMRI / dev_out (do NOT double-count)
    caveats: "CONTAMINATED for a FLAMeS base: this IS FLAMeS ref-13 training data (in-sample probability maps -> non-exchangeable null; its 'clean' within-site ECE 0.02-0.03 is an in-sample artefact) AND = Shifts dev_out. FORBIDDEN as a FLAMeS conformal null / held-out test. Single site (3T Siemens Ljubljana), FUSED consensus mask only. Recoverable only with a leave-this-out base model."

  mslesseg:
    title: "MSLesSeg / ICPR-2024 (Nature Sci Data 2025)"
    source: "https://github.com/alessiarondinella/MSLesSeg-2024  (data on Figshare)"
    license: "CC-BY-4.0 (VERIFY live Figshare record + any DLA before ingest)"
    verdict: include                         # TIER 1 — largest usable N
    patients: 75                             # 115 scans
    usable_labeled: 115                       # VERIFIED: Figshare release INCLUDES test masks (93 train + 22 test)
    longitudinal: 25                          # Pn/{T1,T2,T3} = timepoints; 25 patients have >=2
    consensus_type: hierarchical_review       # 1 junior rater, validated by neuroradiologist + neurologist (NOT independent multi-rater)
    sequences: [T1, T2, FLAIR]                # per timepoint folder: FLAIR + T1 + T2 + MASK
    geometry: 3D_iso
    space: MNI_1mm                            # VERIFIED (182,218,182) 1mm binary, drop-in with open_ms_data
    subset_gb: 1.4
    status: have                              # downloaded to data/external/mslesseg
    fetch: manifests/fetch_mslesseg.sh
    base_model_overlap: {flames: false}      # CLEAN: FLAMeS external-test only, not training -> valid null
    per_scanner_labels: "UNVERIFIED — ~3 Catania 1.5T scanners but no per-scan scanner ID confirmed in the Figshare release; treat as ONE site until verified"
    caveats: "The valuable CLEAN (FLAMeS-independent) 3D-MNI volume. BUT: single-city Catania 1.5T; 3mm floor drops small lesions; GT single-rater-validated NOT consensus; per-scanner metadata likely absent -> only usable as ONE whole-dataset site (re-imports the annotation confound). SAME pool as MSValid -> dedupe."

  sibbms:
    title: "SibBMS — Siberian Brain MS (MELBA 2025, peer-reviewed)"
    source: "https://ai.nsu.ru/files/sibbms/sibbms.zip  (request form)"
    license: "CONTRADICTORY in paper (CC BY 3.0 vs CC BY-NC-SA 3.0) — CLARIFY before use"
    verdict: conditional                      # TAKE THE CONTROLS; hold the patients
    patients: 93                              # RRMS 57 / SPMS 24 / PPMS 5 / RIS 7
    healthy_controls: 100                     # protocol-matched, lesion-free -> the value
    usable_labeled: 10                        # ONLY 10 lesion masks released (NOT 93)
    consensus_type: hierarchical_review       # 3-tier review cascade, single consensus mask
    sequences: [T1, T1-Gd, T2, FLAIR]
    geometry: mixed                           # 1.5T ~4mm thick + 3T ~0.6mm
    space: native
    status: available
    caveats: "HIGH VALUE = 100 healthy controls on same scanner/protocol = a genuine conformal FALSE-NULL. But only 10 masks public, native space, single-vendor Philips, license self-contradictory. Split use: take controls now, gate patient labels on author email."

  msseg2016:
    title: "MSSEG-2016 (Commowick et al., Sci Rep 2018) — 7-RATER GOLD"
    source: "https://portal.fli-iam.irisa.fr/msseg-challenge/  (Shanoir)"
    license: "restricted (Shanoir account + free DUA)"
    verdict: include                          # TIER 2 — the consensus anchor
    patients: 53                              # 15 train / 38 test
    usable_labeled: 15                        # test GT hidden (server-side eval)
    consensus_type: multi_rater_staple        # 7 independent raters, LOP-STAPLE — field's best "false=consensus"
    sequences: [T1, T1-Gd, T2, PD, FLAIR]
    geometry: 3D_iso
    space: native                             # MNI-registerable (Anima pipeline)
    multi_site: "4 centers / 4 scanners, 1.5T+3T, Siemens/Philips/GE"
    status: gated
    base_model_overlap: {flames: true}       # CONFIRMED: FLAMeS ref 14 (Commowick 2021) = MSSEG-2016 -> IN-SAMPLE
    appears_in: [shifts_ms]                   # MSSEG-1 = Shifts in-domain (Rennes/Bordeaux/Lyon)
    commercial_use: prohibited               # OFSEP DUA: non-commercial; contact OFSEP for commercial
    term: 3yr
    per_site_masks: "~3.75 (15 masks / 4 centers) -> min conformal p ~0.21: CANNOT support a per-site null"
    caveats: "The annotation-uniform (7-rater LOP-STAPLE) scanner-isolation anchor IN PRINCIPLE — but (1) CONTAMINATED: FLAMeS ref-14 training data, so unusable as a FLAMeS null until a base-model swap; (2) only 15 open masks across 4 centers = ~3.75/site, too few for a per-site conformal null (F1); (3) OFSEP DUA is NON-COMMERCIAL + 3yr. Recoverable as the scanner-isolation instrument ONLY with a leave-this-out base model."

  msseg2:
    title: "MSSEG-2 (MICCAI 2021) — NEW-lesion, multi-site"
    source: "https://portal.fli-iam.irisa.fr/msseg-2/  (Shanoir)"
    license: "restricted (Shanoir account + free DUA)"
    verdict: conditional                      # INCLUDE if new-lesion (C4) aligned
    patients: 100                             # 40 train / 60 test, 2 timepoints
    usable_labeled: 40
    consensus_type: multi_rater_staple        # 4 raters, majority vote (weaker than 2016's LOP-STAPLE)
    sequences: [FLAIR]                         # FLAIR-only (limits scorer features)
    geometry: 3D_iso
    space: native
    multi_site: "15 scanners / 3 vendors, 1.5T+3T — strongest diversity"
    status: gated
    base_model_overlap: {flames: false}      # CLEAN: FLAMeS external-test only -> the load-bearing scanner instrument
    commercial_use: prohibited               # OFSEP/Shanoir DUA: non-commercial + 3yr
    term: 3yr
    per_site_masks: "~2.7 (40 masks / 15 scanners) -> min conformal p ~0.27: NO per-site null; use for MARGINAL shift only"
    caveats: "THE load-bearing clean instrument: FLAMeS-INDEPENDENT + annotation-uniform (4-rater majority) across 15 scanners -> the one design that ISOLATES scanner effect with the current base model. BUT FLAIR-only (limits scorer features), new-lesion task (C4 not burden), 40 masks/15 scanners too few for per-site nulls (marginal-shift study only), OFSEP DUA non-commercial. Primary scanner-shift claim should be built here."

  shifts_ms:
    title: "Shifts / Shifts 2.0 White-Matter MS Lesion benchmark (Malinin et al., NeurIPS 2022)"
    source: "https://shifts.grand-challenge.org/medical-dataset/  (Zenodo 7051658 + 7051692)"
    license: "CC-BY-NC-SA 4.0 + OFSEP DUA — NON-COMMERCIAL, 3yr"
    verdict: reference                        # TIER-0 as a BENCHMARK PROTOCOL, not fresh data
    commercial_use: prohibited
    term: 3yr
    patients: "~O(100) labeled aggregated"
    composition: "MSSEG-2016 (in-domain) + ISBI-2015 (train) + Ljubljana/PubMRI (dev_out) + private Lausanne (eval_out, GT withheld)"
    sequences: [T1, FLAIR]
    geometry: 3D_iso
    space: MNI_1mm
    multi_site: "~6 centers (Rennes/Bordeaux/Lyon/Best/Ljubljana/Lausanne), 1.5T+3T, Siemens/Philips/GE"
    base_model_overlap: {flames: true}       # its components ARE FLAMeS training data
    status: available
    caveats: "THE field's distribution-shift MS benchmark (in-domain vs dev_out/eval_out) — a conformal-FDR-under-shift paper is expected to report on it. BUT for a FLAMeS base it is CONTAMINATED (all public components are FLAMeS training), NON-COMMERCIAL, and supports only a MARGINAL (pooled) shift eval, not per-site Mondrian nulls. Adopt its SPLITS/PROTOCOL + lesion-wise+retention metrics; use as data only with a Shifts-independent base model. Companion uncertainty code: github.com/NatalijaMolch/MS_WML_uncs."

  miccai2008:
    title: "MICCAI-2008 MS Lesion Challenge (CHB/UNC, Boston)"
    source: "https://www.nitrc.org/projects/msseg/"
    license: "challenge/registration terms (NITRC, password-gated)"
    verdict: conditional                      # external OOD test only
    patients: 45                              # 20 train (public masks) + 25 test (hidden)
    usable_labeled: 20                        # 10 CHB (3T Siemens) + 10 UNC (3T Siemens Allegra)
    consensus_type: single                    # single CHB expert (weakness)
    sequences: [T1, T2, FLAIR]
    geometry: 3D_iso                          # 0.5mm isotropic -> resamplable to MNI-1mm
    space: native
    multi_site: "2 sites / 2 scanners (CHB + UNC), both 3T Siemens"
    base_model_overlap: {flames: false}      # NOT in FLAMeS refs -> clean external test
    status: available
    caveats: "Clean (FLAMeS-independent) 2-site 3D-iso public masks — a rare uncontaminated cross-site probe. BUT single-rater GT, old (2008 acquisition), 20 masks. External OOD test, not a calibration anchor."

  ms3seg:
    title: "MS3SEG (Bashiri et al., Nature Sci Data 2026) — Toshiba/Iran"
    source: "https://github.com/Mahdi-Bashiri/MS3SEG  (Figshare 30393475)"
    license: "CC-BY-4.0 (data), MIT (code)"
    verdict: conditional                      # cross-vendor EXTERNAL TEST only, native 2D
    patients: 100
    usable_labeled: 100
    consensus_type: single                    # rater count/IRR NOT documented
    tri_mask: "3 CLASSES (ventricles / normal-WMH / MS-lesion), NOT 3 raters. MS-lesion mask IS separable (good)."
    sequences: [T1, T2, FLAIR]
    geometry: 2D_thick                         # axial 2D, anisotropic; voxel geometry NOT published
    space: native
    subset_gb: 5.0
    status: available
    caveats: "EXCLUDE from any MNI-1mm pipeline (resampling fabricates data). Use ONLY as a single cross-vendor (Toshiba 1.5T) domain-shift test in native 2D. Unknown raters, no IRR."

  msmri_dib:
    title: "Brain MRI MS consensus (Muslim et al., Data in Brief 2022) — Baghdad"
    source: "https://data.mendeley.com/datasets/8bctsm8jz7/1"
    license: "CC-BY-4.0"
    verdict: conditional                      # supplementary external test only
    patients: 60
    usable_labeled: 60
    consensus_type: hierarchical_review       # resident -> consultant radiologist -> neurologist (correction chain, not independent)
    sequences: [T1, T2, FLAIR]
    geometry: 2D_thick                         # 2D FLAIR 1.5T, geometry unspecified
    space: native
    status: available
    caveats: "Baghdad cohort. Multi-centre ACQUISITION (~20 sources) but uncontrolled/undocumented. 2D thick-slice -> not clean MNI-1mm. No controls, no phenotype. Cheap real-world robustness test only."

  pedims:
    title: "PediMS — Pediatric MS (Nature Sci Data 2025)"
    source: "https://www.nature.com/articles/s41597-025-05346-5  (Figshare 28701065)"
    license: "CC-BY-4.0"
    verdict: conditional                      # OOD pediatric probe only
    patients: 9
    usable_labeled: 28                        # scans; longitudinal
    consensus_type: hierarchical_review       # 1 delineator + 2 senior validators
    sequences: [T1, T2, FLAIR]
    geometry: 2D_thick                         # FLAIR 3.9mm thick
    space: native
    status: available
    caveats: "Unique pediatric domain-shift stress test. N far too small for conformal calibration. Frictionless CC-BY. One Balo's-sclerosis outlier (non-MS)."

  msvalid:
    title: "MSValid (Zenodo 2024) — Catania"
    source: "https://zenodo.org/records/10875606"
    license: "CC-BY-4.0"
    verdict: exclude                          # NO public masks
    patients: 84
    usable_labeled: 0                         # UNLABELED image pool — no GT
    consensus_type: none
    sequences: [T1, T2, FLAIR]
    space: native
    status: available
    caveats: "EXCLUDE: no public lesion masks (2.9 GB image-only zip). Same Catania source as MSLesSeg (overlap risk). Usable only as an unlabeled OOD/inference pool, never as GT."
